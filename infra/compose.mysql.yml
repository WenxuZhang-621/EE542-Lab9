name: ee542-lab9
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_DATABASE: groupchat
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: ${LAB9_MYSQL_PASSWORD:?Set LAB9_MYSQL_PASSWORD in root .env}
      MYSQL_ROOT_PASSWORD: ${LAB9_MYSQL_ROOT_PASSWORD:?Set LAB9_MYSQL_ROOT_PASSWORD in root .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
