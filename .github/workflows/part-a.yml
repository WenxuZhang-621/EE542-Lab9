name: Part A checks
on:
  push:
    paths: ['webapp/**', 'rag/**', 'shared/**', 'scripts/**', 'tests/**', 'requirements-a.txt', '.github/workflows/part-a.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: groupchat
          MYSQL_USER: chatuser
          MYSQL_PASSWORD: ci-local-password
          MYSQL_ROOT_PASSWORD: ci-local-root-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      DATABASE_URL: mysql+asyncmy://chatuser:ci-local-password@127.0.0.1:3306/groupchat
      JWT_SECRET: ci-test-only-secret-at-least-thirty-two-characters
      LAB9_TEST_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-a.txt -r tests/requirements.txt
      - name: Test A's web, RAG integration, public access, and Asset Links
        run: python -m pytest tests/test_webapp.py tests/test_web_rag.py tests/test_public_access.py tests/test_assetlinks.py -q
      - run: node --check webapp/frontend/app.js
      - run: docker compose --env-file .env.example -f infra/compose.a.yml config --quiet
        env:
          LAB9_MYSQL_PASSWORD: ci-local-password
          LAB9_MYSQL_ROOT_PASSWORD: ci-local-root-password
